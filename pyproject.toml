[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flagdash"
version = "0.1.0"
description = "Official Python SDK for FlagDash — Feature Flags, Remote Config & AI Config Management"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "FlagDash", email = "support@flagdash.com" },
]
keywords = ["feature-flags", "remote-config", "ai-config", "flagdash", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://flagdash.com"
Documentation = "https://flagdash.com/docs"
Repository = "https://github.com/flagdash/flagdash-python"
Changelog = "https://github.com/flagdash/flagdash-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-httpx>=0.21",
    "ruff>=0.16,<0.17",
    "mypy>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flagdash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py39"
line-length = 100

# Declared explicitly rather than inherited. With no `select`, the rule set is
# whatever the installed ruff happens to default to — which is how CI began
# failing with 41 findings against unchanged code when a new ruff broadened its
# defaults. Enabling rule families here makes that a deliberate decision.
#
# Deliberately not enabled yet: BLE001 (blind except), S110 (try/except/pass) and
# TRY002 (vanilla exception classes). They have a point, but narrowing exception
# handling in a published SDK is a behaviour change, not a lint fix, and belongs
# in its own review.
[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # import sorting
  "W",  # pycodestyle warnings
  "UP", # pyupgrade
  "B",  # bugbear
]

[tool.mypy]
python_version = "3.9"
strict = true
